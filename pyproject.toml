[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor_engagement_audio"
version = "0.1.0"
description = "Sistema predictivo de engagement por senales acusticas y diagnostico con LLM local"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*", "app*"]
